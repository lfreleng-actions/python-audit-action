---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# python-audit-action
name: '🐍 Python Dependency Audit'
description: 'Check Python dependencies for known security vulnerabilities'

inputs:
  # Mandatory
  python_version:
    description: 'Python version used to perform audit'
    required: true
  # Optional
  artefact_name:
    # Useful when building for multiple platforms/architectures
    # Can be used to avoid downloading artefacts with conflicting names
    description: 'Artefact name to download (defaults to project name)'
    required: false
    # type: string
  permit_fail:
    description: >
      Continue/pass even when the audit fails. Accepts 'true' or
      'false' (any case); any other value fails the action.
    required: false
    # type: boolean
    default: 'false'
  artefact_path:
    description: 'Path/location to build artefacts'
    # type: string
    required: false
    default: 'dist'
  summary:
    description: 'Whether to generate summary output'
    # type: boolean
    required: false
    default: 'true'
  path_prefix:
    description: 'Directory location containing project code'
    # type: string
    required: false
    default: ''
  ignore_vulns:
    description: >
      Vulnerability IDs to ignore (whitespace separated). These IDs
      are merged with any IDs sourced from the allow-list file (see
      the allow_list_* inputs); duplicates are de-duplicated.
    # type: string
    required: false
    default: 'GHSA-4xh5-x5gv-qwph'
  allow_list_path:
    description: >
      Local filesystem path to a vulnerability allow-list file. When
      set, takes precedence over allow_list_url and allow_list_org.
      The path string itself must not contain newline characters; the
      file it points to may be multi-line. File format:
      whitespace-separated vulnerability IDs (CVE-, GHSA-, PYSEC-,
      OSV-, PVE-); '#' introduces a comment (full-line or trailing).
    # type: string
    required: false
    default: ''
  allow_list_url:
    description: >
      Remote HTTPS URL to download the allow-list from. Ignored when
      allow_list_path is set. When both allow_list_path and
      allow_list_url are empty the action constructs a default URL
      from allow_list_org (see below). The URL string itself must not
      contain newline characters.
    # type: string
    required: false
    default: ''
  allow_list_org:
    description: >
      GitHub organisation/owner used to construct the default
      allow-list URL when neither allow_list_path nor allow_list_url
      is supplied. Defaults at runtime to github.repository_owner.
      Default URL pattern:
      https://raw.githubusercontent.com/<org>/.github/HEAD/.github/python-audit/<org>/allow_list.txt
    # type: string
    required: false
    default: ''
  allow_list_disable:
    description: >
      When 'true', skip allow-list loading entirely and use only the
      'ignore_vulns' input.
    # type: boolean
    required: false
    default: 'false'
  config:
    description: >
      GitHub-Actions uses-style coordinate identifying a remote
      allow-list file, fetched with a shallow, ref-pinned git fetch
      (supports branch, tag or commit SHA). Mutually exclusive with
      the allow_list_path, allow_list_url, allow_list_org and
      allow_list_disable inputs; supplying any of them together with
      'config' is an error (allow_list_summary is still honoured). See
      the README for the full grammar.
    # type: string
    required: false
    default: ''
  token:
    description: >
      Token used to authenticate the git fetch when 'config' targets
      a private host repository. Leave empty for public repositories.
      GITHUB_TOKEN only grants access to the current repository;
      reading a private config repo in another org needs a PAT or
      GitHub App token with contents:read on that repo.
    # type: string
    required: false
    default: ''
  allow_list_summary:
    description: >
      Whether to write the allow-list/config block to the job step
      summary. Set to 'false' to suppress it. Useful for matrix jobs,
      where the same block would otherwise repeat once per leg; emit
      it on a single matrix leg only (see the README for the
      strategy.job-index pattern).
    # type: boolean
    required: false
    default: 'true'

outputs:
  audit_outcome:
    description: >-
      Outcome of the pip-audit step that ran: 'success', 'failure' or
      'cancelled', or 'skipped' when no audit ran. Reports 'failure'
      even when permit_fail let the action pass.
    # outcome, not conclusion: continue-on-error turns the permitted
    # step's conclusion into 'success' even when the audit failed.
    value: >-
      ${{ steps.audit_strict.outcome != 'skipped'
      && steps.audit_strict.outcome
      || steps.audit_permitted.outcome
      || 'skipped' }}
  resolved_host_org:
    description: 'Host org the config file was fetched from'
    value: "${{ steps.config_resolve.outputs.resolved_host_org }}"
  resolved_repo:
    description: 'Repository the config file was fetched from'
    value: "${{ steps.config_resolve.outputs.resolved_repo }}"
  resolved_ref:
    description: 'Git ref requested for the config fetch'
    value: "${{ steps.config_resolve.outputs.resolved_ref }}"
  resolved_sha:
    description: 'Exact commit SHA the config ref resolved to'
    value: "${{ steps.config_resolve.outputs.resolved_sha }}"
  resolved_path:
    description: 'In-repo path of the matched config file'
    value: "${{ steps.config_resolve.outputs.resolved_path }}"
  matched_candidate:
    description: 'Search candidate that matched'
    value: "${{ steps.config_resolve.outputs.matched_candidate }}"

runs:
  using: 'composite'
  steps:
    # Runs first so a bad value fails before any download or install.
    - name: 'Validate permit_fail input'
      shell: bash
      env:
        PERMIT_FAIL: "${{ inputs.permit_fail }}"
      run: |
        # Validate permit_fail
        # The audit steps compare this input to 'true'/'false' in
        # case-insensitive expressions. Any other value (yes, 1, an
        # empty string from an unset variable) must fail closed rather
        # than risk the audit being skipped. The case globs match the
        # whole value, so surrounding whitespace or newlines are
        # rejected, exactly as the expressions would not match them.
        set -euo pipefail
        case "$PERMIT_FAIL" in
          [Tt][Rr][Uu][Ee] | [Ff][Aa][Ll][Ss][Ee])
            echo "permit_fail: ${PERMIT_FAIL}"
            ;;
          *)
            # %q renders the value on one line, so it cannot inject
            # a workflow command through an embedded newline.
            printf '::error::Invalid permit_fail value: %q' "$PERMIT_FAIL"
            printf " (expected 'true' or 'false', any case)\n"
            exit 1
            ;;
        esac

    - name: 'Resolve project name'
      id: naming
      if: inputs.artefact_name == ''
      # yamllint disable-line rule:line-length
      uses: lfreleng-actions/build-metadata-action@689e13653176908922b12f85cb93b061c467ba6f  # v0.13.2
      with:
        path_prefix: "${{ inputs.path_prefix || '.' }}"
        project_type: 'python'
        use_version_extract: 'false'
        include_environment: 'false'
        artifact_upload: 'false'
        output_format: ''
        python_offline_mode: 'true'

    # build-metadata-action succeeds with an empty name when it finds
    # no project to name, and download-artifact given an empty name
    # downloads every artefact in the run, so stop here instead.
    - name: 'Check artefact name'
      shell: bash
      env:
        ARTEFACT_NAME: "${{ inputs.artefact_name }}"
        PROJECT_NAME: "${{ steps.naming.outputs.project_name }}"
      run: |
        # Check artefact name
        set -euo pipefail
        if [ -z "$ARTEFACT_NAME" ] && [ -z "$PROJECT_NAME" ]; then
          echo "::error::No artefact name: artefact_name is unset and" \
               "no Python project name was found under path_prefix"
          exit 1
        fi

    # GitHub's artefact service can fail to list an artefact for a few
    # seconds after its upload, so a download in the job that uploaded
    # it can miss. Each attempt after the first runs only when the one
    # before it failed, after a wait: five attempts, waiting 2, 4, 8
    # and 16 seconds between them. Any failure is retried, since a miss
    # cannot be told from another failure here: artefact_path may hold
    # files before the download. Only the last attempt lacks
    # continue-on-error, so its failure fails the action and every
    # later step, which runs on success() alone, is skipped.
    - name: '⬇ Download build artefacts [1/5]'
      id: download_1
      continue-on-error: true
      # yamllint disable-line rule:line-length
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        # yamllint disable-line rule:line-length
        name: >-
          ${{ inputs.artefact_name ||
              steps.naming.outputs.project_name }}
        path: "${{ inputs.artefact_path }}"

    - name: 'Wait before download attempt 2 of 5'
      if: ${{ steps.download_1.outcome == 'failure' }}
      shell: bash
      env:
        # yamllint disable-line rule:line-length
        ARTEFACT_NAME: "${{ inputs.artefact_name || steps.naming.outputs.project_name }}"
        ATTEMPT: '1'
        MAX_ATTEMPTS: '5'
        DELAY: '2'
      run: |
        # Wait before the next download attempt
        set -euo pipefail
        printf 'Artefact %q not downloaded on attempt %s of %s;' \
          "$ARTEFACT_NAME" "$ATTEMPT" "$MAX_ATTEMPTS"
        printf ' retrying in %ss\n' "$DELAY"
        sleep "$DELAY"

    - name: '⬇ Download build artefacts [2/5]'
      id: download_2
      if: ${{ steps.download_1.outcome == 'failure' }}
      continue-on-error: true
      # yamllint disable-line rule:line-length
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        # yamllint disable-line rule:line-length
        name: >-
          ${{ inputs.artefact_name ||
              steps.naming.outputs.project_name }}
        path: "${{ inputs.artefact_path }}"

    - name: 'Wait before download attempt 3 of 5'
      if: ${{ steps.download_2.outcome == 'failure' }}
      shell: bash
      env:
        # yamllint disable-line rule:line-length
        ARTEFACT_NAME: "${{ inputs.artefact_name || steps.naming.outputs.project_name }}"
        ATTEMPT: '2'
        MAX_ATTEMPTS: '5'
        DELAY: '4'
      run: |
        # Wait before the next download attempt
        set -euo pipefail
        printf 'Artefact %q not downloaded on attempt %s of %s;' \
          "$ARTEFACT_NAME" "$ATTEMPT" "$MAX_ATTEMPTS"
        printf ' retrying in %ss\n' "$DELAY"
        sleep "$DELAY"

    - name: '⬇ Download build artefacts [3/5]'
      id: download_3
      if: ${{ steps.download_2.outcome == 'failure' }}
      continue-on-error: true
      # yamllint disable-line rule:line-length
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        # yamllint disable-line rule:line-length
        name: >-
          ${{ inputs.artefact_name ||
              steps.naming.outputs.project_name }}
        path: "${{ inputs.artefact_path }}"

    - name: 'Wait before download attempt 4 of 5'
      if: ${{ steps.download_3.outcome == 'failure' }}
      shell: bash
      env:
        # yamllint disable-line rule:line-length
        ARTEFACT_NAME: "${{ inputs.artefact_name || steps.naming.outputs.project_name }}"
        ATTEMPT: '3'
        MAX_ATTEMPTS: '5'
        DELAY: '8'
      run: |
        # Wait before the next download attempt
        set -euo pipefail
        printf 'Artefact %q not downloaded on attempt %s of %s;' \
          "$ARTEFACT_NAME" "$ATTEMPT" "$MAX_ATTEMPTS"
        printf ' retrying in %ss\n' "$DELAY"
        sleep "$DELAY"

    - name: '⬇ Download build artefacts [4/5]'
      id: download_4
      if: ${{ steps.download_3.outcome == 'failure' }}
      continue-on-error: true
      # yamllint disable-line rule:line-length
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        # yamllint disable-line rule:line-length
        name: >-
          ${{ inputs.artefact_name ||
              steps.naming.outputs.project_name }}
        path: "${{ inputs.artefact_path }}"

    - name: 'Wait before download attempt 5 of 5'
      if: ${{ steps.download_4.outcome == 'failure' }}
      shell: bash
      env:
        # yamllint disable-line rule:line-length
        ARTEFACT_NAME: "${{ inputs.artefact_name || steps.naming.outputs.project_name }}"
        ATTEMPT: '4'
        MAX_ATTEMPTS: '5'
        DELAY: '16'
      run: |
        # Wait before the next download attempt
        set -euo pipefail
        printf 'Artefact %q not downloaded on attempt %s of %s;' \
          "$ARTEFACT_NAME" "$ATTEMPT" "$MAX_ATTEMPTS"
        printf ' retrying in %ss\n' "$DELAY"
        sleep "$DELAY"

    - name: '⬇ Download build artefacts [5/5]'
      id: download_5
      if: ${{ steps.download_4.outcome == 'failure' }}
      # yamllint disable-line rule:line-length
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        # yamllint disable-line rule:line-length
        name: >-
          ${{ inputs.artefact_name ||
              steps.naming.outputs.project_name }}
        path: "${{ inputs.artefact_path }}"

    # The last attempt has already failed the action; this names the
    # artefact and the attempt count, then keeps the action failed.
    - name: 'Report artefact download failure'
      if: ${{ failure() && steps.download_5.outcome == 'failure' }}
      shell: bash
      env:
        # yamllint disable-line rule:line-length
        ARTEFACT_NAME: "${{ inputs.artefact_name || steps.naming.outputs.project_name }}"
        MAX_ATTEMPTS: '5'
      run: |
        # Report artefact download failure
        set -euo pipefail
        # %q renders the name on one line, so it cannot inject a
        # workflow command through an embedded newline.
        printf '::error::Artefact %q not downloaded after %s attempts\n' \
          "$ARTEFACT_NAME" "$MAX_ATTEMPTS"
        exit 1

    - name: "Setup Python ${{ inputs.python_version }}"
      # yamllint disable-line rule:line-length
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "${{ inputs.python_version }}"

    # Only pip's cache is populated here: the install step runs pip in
    # a fresh venv of the action's own, never Poetry/Pipenv, and that
    # venv is rebuilt on every run, so it is not cached. The key hashes
    # exactly what that step installs: the top-level wheels in
    # artefact_path (downloaded above) and the optional
    # requirements.txt in path_prefix.
    - name: 'Cache Python dependencies'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pip
        # yamllint disable rule:line-length
        key: >-
          python-${{ runner.os }}-${{ runner.arch }}-${{ inputs.python_version }}-
          ${{ hashFiles(format('{0}/*.whl', inputs.artefact_path), format('{0}/requirements.txt', inputs.path_prefix || '.')) }}
        restore-keys: |
          python-${{ runner.os }}-${{ runner.arch }}-${{ inputs.python_version }}-
          python-${{ runner.os }}-${{ runner.arch }}-
        # yamllint enable rule:line-length

    # Runs without the token: it only checks that 'config' is not
    # combined with the other allow-list source inputs.
    - name: 'Check config input exclusivity'
      if: ${{ inputs.config != '' }}
      shell: bash
      env:
        AL_PATH: "${{ inputs.allow_list_path }}"
        AL_URL: "${{ inputs.allow_list_url }}"
        AL_ORG: "${{ inputs.allow_list_org }}"
        AL_DISABLE: "${{ inputs.allow_list_disable }}"
      run: |
        # Check config input exclusivity
        set -euo pipefail

        # Exclusivity: 'config' must not combine with the allow-list
        # source inputs (allow_list_summary is still honoured).
        if [ -n "$AL_PATH" ] || [ -n "$AL_URL" ] || [ -n "$AL_ORG" ] \
            || [ "$AL_DISABLE" = "true" ]; then
          echo "::error::'config' is mutually exclusive with" \
               "allow_list_path/allow_list_url/allow_list_org/" \
               "allow_list_disable; specify only one mechanism"
          exit 1
        fi

    # This step receives inputs.token, so it runs before the install
    # step puts the audited project into the audit venv: a wheel's
    # .pth file executes at interpreter start-up and could read the
    # token. No step after the install may receive the token.
    #
    # harden-runner-block-action owns the shared resolver; its
    # resolve-config sub-action masks the token and runs the resolver
    # with python3 -I -S. A miss at an auto-derived path exits 0 with
    # found=false; any other failure fails this step.
    - name: 'Resolve allow-list via config'
      id: config_resolve
      if: ${{ inputs.config != '' }}
      # yamllint disable-line rule:line-length
      uses: lfreleng-actions/harden-runner-block-action/resolve-config@65ff87957e1cac2de3203a85dbb07c31810321cb  # v0.16.4
      with:
        config: ${{ inputs.config }}
        token: ${{ inputs.token }}
        family: 'python-audit'
        mode: 'vulns'
        summary: ${{ inputs.allow_list_summary }}
        summary_title: '🐍 Python audit allow-list'
        summary_unit: 'Entries'

    # Installs into a venv of the action's own under RUNNER_TEMP, never
    # into the setup-python interpreter: that one serves every later
    # step of the calling job, and a .pth file or sitecustomize module
    # from the audited project would run in each of them. The venv is
    # never activated beyond this step, and PATH and VIRTUAL_ENV are
    # left alone; the audit steps receive it through their
    # virtual-environment input.
    - name: 'Install build products/dependencies'
      id: install
      shell: bash
      env:
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_ARTEFACT_PATH: ${{ inputs.artefact_path }}
      run: |
        # Install build products/dependencies
        set -euo pipefail
        path_prefix="$INPUT_PATH_PREFIX"
        # Collect the wheels via the glob directly. nullglob makes the
        # pattern expand to nothing (rather than the literal pattern)
        # when nothing matches, so an empty or mis-named artefact
        # directory reports that plainly instead of handing pip a
        # literal '*.whl' to choke on.
        shopt -s nullglob
        wheels=("$INPUT_ARTEFACT_PATH"/*.whl)
        shopt -u nullglob

        if [ "${#wheels[@]}" -eq 0 ]; then
          echo "Error: no wheels found in: $INPUT_ARTEFACT_PATH ❌"
          echo 'Check that the build uploaded artefacts, and that'
          echo 'artefact_name matches the name used at upload time'
          exit 1
        fi

        # --clear empties a venv left by an earlier run of this action
        # in the same job, so each audit sees only its own install.
        venv="${RUNNER_TEMP}/python-audit-action/venv"
        echo "Creating audit virtual environment: $venv"
        python -m venv --clear "$venv"
        venv_python="$venv/bin/python"
        if [ ! -e "$venv_python" ]; then
          # Windows lays out a venv differently
          venv_python="$venv/Scripts/python.exe"
        fi

        echo 'Upgrading: pip, setuptools'
        "$venv_python" -m pip install --disable-pip-version-check \
          -q --upgrade pip setuptools
        echo 'Installing built package(s) and dependencies'
        echo "Wheels to install: ${#wheels[@]}"
        for wheel in "${wheels[@]}"; do
          "$venv_python" -m pip install -q "$wheel"
        done
        # Check for requirements.txt in path_prefix if provided
        req_file="${path_prefix:+$path_prefix/}requirements.txt"
        if [ -f "$req_file" ]; then
          echo "Installing dependencies from: $req_file"
          "$venv_python" -m pip install -q -r "$req_file"
        fi
        echo "venv=${venv}" >> "$GITHUB_OUTPUT"

    - name: 'Resolve vulnerability allow-list'
      id: allow_list
      if: ${{ inputs.config == '' }}
      shell: bash
      env:
        ALLOW_LIST_PATH: "${{ inputs.allow_list_path }}"
        ALLOW_LIST_URL: "${{ inputs.allow_list_url }}"
        ALLOW_LIST_ORG: "${{ inputs.allow_list_org }}"
        ALLOW_LIST_DISABLE: "${{ inputs.allow_list_disable }}"
        ALLOW_LIST_SUMMARY: "${{ inputs.allow_list_summary }}"
        REPO_OWNER: "${{ github.repository_owner }}"
      run: |
        # Resolve vulnerability allow-list
        #
        # Precedence:
        #   allow_list_path > allow_list_url > default URL from org.
        # Soft-fail rule:
        #   In the default-URL case (no path, no url), only an HTTP 404
        #   from the default URL is a soft miss (no central file
        #   published) and proceeds silently. Transient failures
        #   (HTTP 403/408/429/5xx, DNS/connect/TLS/timeout/reset) are
        #   retried with backoff (see the retry policy below) and are
        #   hard errors once retries run out; any other failure,
        #   including max-filesize, is a hard error at once. An
        #   explicitly-supplied path or url is a hard failure when it
        #   cannot be loaded, since the caller asked for it.
        # Sanitisation:
        #   Every token is matched against a strict allow-list of
        #   vulnerability ID shapes (CVE-/GHSA-/PYSEC-/OSV-/PVE-).
        #   Non-conforming content fails the step rather than being
        #   silently dropped.
        set -euo pipefail

        emit() {
          # Append a key=value pair to GITHUB_OUTPUT, refusing values
          # containing newlines (none of our outputs ever need them).
          local key="$1"
          local value="$2"
          if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
            echo "::error::Refusing to write multi-line output for ${key}"
            exit 1
          fi
          printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
        }

        summary_line() {
          if [ "$ALLOW_LIST_SUMMARY" = "false" ]; then
            return 0
          fi
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          fi
        }

        if [ "$ALLOW_LIST_DISABLE" = "true" ]; then
          echo "Allow-list loading disabled via allow_list_disable input"
          emit "ids" ""
          emit "source" "disabled"
          emit "resolved_url" ""
          emit "count" "0"
          exit 0
        fi

        # Reject newlines in path/url inputs to keep downstream
        # GITHUB_OUTPUT writes safe. Test the whole value with bash
        # pattern matching: a line-by-line grep would accept a value
        # whose first line is valid but which embeds a newline.
        for name in ALLOW_LIST_PATH ALLOW_LIST_URL; do
          value="${!name}"
          if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
            echo "::error::Input '${name}' must not contain newline characters"
            exit 1
          fi
        done

        source=""
        resolved_url=""
        raw=""
        soft_fail="false"

        if [ -n "$ALLOW_LIST_PATH" ]; then
          source="path"
          if [ ! -f "$ALLOW_LIST_PATH" ]; then
            echo "::error::Allow-list file not found at: ${ALLOW_LIST_PATH}"
            exit 1
          fi
          raw=$(cat -- "$ALLOW_LIST_PATH")
          echo "Source: local path -> ${ALLOW_LIST_PATH}"
        else
          if [ -n "$ALLOW_LIST_URL" ]; then
            source="url"
            resolved_url="$ALLOW_LIST_URL"
          else
            org="${ALLOW_LIST_ORG:-$REPO_OWNER}"
            # GitHub org/user names: 1-39 chars, alphanumerics and
            # hyphens, no leading/trailing hyphen, no consecutive
            # hyphens. A bad org name produces a URL that can never
            # resolve; reject it up front. Reject newlines first with
            # bash pattern matching, since the line-by-line grep below
            # would otherwise accept a multi-line value whose first
            # line happens to be a valid org.
            if [[ "$org" == *$'\n'* || "$org" == *$'\r'* ]]; then
              echo "::error::Org name must not contain newline characters"
              exit 1
            fi
            # Enforce the 1-39 character limit explicitly: the ERE
            # below cannot (its repeated group may consume a hyphen
            # plus an alphanumeric, so it would otherwise admit names
            # longer than 39 characters).
            if [ "${#org}" -lt 1 ] || [ "${#org}" -gt 39 ]; then
              echo "::error::Resolved org name length invalid: '${org}'"
              exit 1
            fi
            if ! printf '%s' "$org" \
              | grep -Eq '^[A-Za-z0-9](-?[A-Za-z0-9]){0,38}$'; then
              echo "::error::Resolved org name is invalid: '${org}'"
              exit 1
            fi
            resolved_url="https://raw.githubusercontent.com/${org}/.github/HEAD/.github/python-audit/${org}/allow_list.txt"
            source="default-url"
            soft_fail="true"
          fi

          # Retry policy for the fetch, defined here and nowhere else.
          # retry_delays: seconds to wait before each retry, so the
          #   fetch makes at most ${#retry_delays[@]}+1 attempts. A 503
          #   blip can last tens of seconds, so this backs off further
          #   than the config path's git fetch.
          # retry_after_cap: ceiling on a server's Retry-After.
          # fetch_deadline: overall bound in seconds. No retry starts
          #   whose delay would end past it, and each attempt's
          #   --max-time is cut to the time left, so a real outage
          #   still fails the job quickly.
          # transient_curl_rc: curl exit codes retried: 6 (DNS), 7
          #   (connection refused), 28 (timeout), 35 (TLS handshake),
          #   52 (empty reply), 55 (send error/reset), 56 (receive
          #   error/reset). Any other exit code, including 63
          #   (--max-filesize exceeded), fails at once.
          # Transient HTTP statuses are 403, 408, 429 and 5xx.
          retry_delays=(2 5 10 20)
          retry_after_cap=30
          fetch_deadline=90
          attempt_max_time=15
          transient_curl_rc=" 6 7 28 35 52 55 56 "
          max_attempts=$(( ${#retry_delays[@]} + 1 ))

          # HTTPS-only, 1 MiB size ceiling, follow redirects. We
          # deliberately omit --fail and capture the HTTP status
          # separately so that a genuine "file absent" (404) can be
          # told apart from other failures. Only a 404 at the default
          # URL is a soft miss; every other non-200 outcome fails the
          # step, after retries where it is transient. Each attempt
          # writes to a fresh file, so a partial body from a failed
          # attempt is never parsed.
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          start=$SECONDS
          attempt=0
          body=""
          while :; do
            attempt=$((attempt + 1))
            body="${tmpdir}/body.${attempt}"
            headers="${tmpdir}/headers.${attempt}"
            remaining=$(( fetch_deadline - (SECONDS - start) ))
            max_time=$attempt_max_time
            if [ "$remaining" -lt "$max_time" ]; then
              max_time=$(( remaining > 1 ? remaining : 1 ))
            fi
            set +e
            http_code=$(curl --proto '=https' --tlsv1.2 \
              -sSL --max-time "$max_time" --max-filesize 1048576 \
              -H 'User-Agent: lfreleng-actions/python-audit-action' \
              -H 'Accept: text/plain, */*;q=0.5' \
              -w '%{http_code}' \
              -D "$headers" \
              -o "$body" \
              -- "$resolved_url")
            rc=$?
            set -e

            if [ "$rc" -eq 0 ] && [ "$http_code" = "200" ]; then
              break
            fi
            if [ "$rc" -eq 0 ] && [ "$http_code" = "404" ] \
               && [ "$soft_fail" = "true" ]; then
              # No allow-list published for this org; proceed with
              # whatever ignore_vulns provided.
              echo "No central allow-list at default URL (HTTP 404);" \
                   "proceeding without it"
              emit "ids" ""
              emit "source" "default-url-missing"
              emit "resolved_url" "$resolved_url"
              emit "count" "0"
              exit 0
            fi

            transient="false"
            if [ "$rc" -ne 0 ]; then
              failure="curl exit ${rc}"
              if [[ "$transient_curl_rc" == *" ${rc} "* ]]; then
                transient="true"
              fi
            else
              failure="HTTP ${http_code}"
              case "$http_code" in
                403|408|429|5[0-9][0-9]) transient="true" ;;
              esac
            fi

            delay=""
            if [ "$transient" = "true" ] \
               && [ "$attempt" -lt "$max_attempts" ]; then
              delay="${retry_delays[$((attempt - 1))]}"
              # Honour a Retry-After in seconds from the final response
              # (the last header block when redirects were followed),
              # capped, and never shorter than the schedule's delay.
              # The field name matches with or without whitespace after
              # the colon. Leading zeros are dropped and an over-long
              # value caps before any arithmetic, so it cannot overflow.
              # An HTTP-date Retry-After falls back to the schedule.
              retry_after=$(awk '
                { sub(/\r$/, "") }
                /^HTTP\// { ra = "" }
                tolower($0) ~ /^retry-after[ \t]*:/ {
                  ra = $0
                  sub(/^[^:]*:[ \t]*/, "", ra)
                  sub(/[ \t]+$/, "", ra)
                }
                END { print ra }' \
                "$headers" 2>/dev/null || true)
              if [[ "$retry_after" =~ ^[0-9]+$ ]]; then
                retry_after="${retry_after#"${retry_after%%[!0]*}"}"
                retry_after="${retry_after:-0}"
                if [ "${#retry_after}" -gt 4 ] \
                   || [ "$retry_after" -gt "$retry_after_cap" ]; then
                  retry_after=$retry_after_cap
                fi
                if [ "$retry_after" -gt "$delay" ]; then
                  delay=$retry_after
                fi
              fi
              if [ $(( SECONDS - start + delay )) -ge "$fetch_deadline" ]; then
                delay=""
              fi
            fi

            if [ -z "$delay" ]; then
              plural="attempts"
              [ "$attempt" -eq 1 ] && plural="attempt"
              echo "::error::Failed to fetch allow-list from" \
                   "${resolved_url} (${failure}) after ${attempt} ${plural}"
              exit 1
            fi
            echo "::warning::Allow-list fetch attempt" \
                 "${attempt}/${max_attempts} failed (${failure});" \
                 "retrying in ${delay}s"
            sleep "$delay"
          done
          raw=$(cat -- "$body")
          echo "Source: ${source} -> ${resolved_url}"
        fi

        # Strip UTF-8 BOM, strip '#' comments (full-line and
        # trailing), collapse whitespace.
        cleaned=$(printf '%s' "$raw" \
          | sed -e '1s/^\xEF\xBB\xBF//' \
                -e 's/[[:space:]]#[^\r\n]*//g' \
                -e 's/^#[^\r\n]*//g' \
          | tr '[:space:]' '\n' \
          | sed '/^$/d')

        ids=""
        count=0
        # Strict allow-list of vulnerability ID shapes. Any token
        # that does not match one of these is a hard failure.
        id_re='^('
        id_re+='CVE-[0-9]{4}-[0-9]{4,}'
        id_re+='|GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}'
        id_re+='|PYSEC-[0-9]{4}-[0-9]+'
        id_re+='|OSV-[0-9]{4}-[0-9]+'
        id_re+='|PVE-[0-9]+(-[0-9]+)?'
        id_re+=')$'
        while IFS= read -r token; do
          [ -z "$token" ] && continue
          if ! printf '%s' "$token" | grep -Eq "$id_re"; then
            echo "::error::Rejected allow-list token '${token}'" \
                 "(not a recognised CVE/GHSA/PYSEC/OSV/PVE ID)"
            exit 1
          fi
          if [ -z "$ids" ]; then
            ids="$token"
          else
            ids="${ids} ${token}"
          fi
          count=$((count + 1))
        done <<< "$cleaned"

        # An allow-list file that parses to zero tokens (for example,
        # a file containing only comments) is a misconfiguration. The
        # shared config-mode resolver rejects this too, so keep the
        # validation semantics identical across loading mechanisms.
        if [ "$count" -eq 0 ]; then
          echo "::error::Allow-list is empty after parsing (source: ${source})"
          exit 1
        fi

        echo "Loaded ${count} allow-list entries from source '${source}'"
        emit "ids" "$ids"
        emit "source" "$source"
        emit "resolved_url" "$resolved_url"
        emit "count" "$count"

        summary_line "### 🐍 Python audit allow-list"
        summary_line ""
        if [ -n "$resolved_url" ]; then
          summary_line "- Source: \`${source}\` (\`${resolved_url}\`)"
        else
          summary_line "- Source: \`${source}\`"
        fi
        summary_line "- Entries loaded: **${count}**"
        summary_line ""

    - name: 'Merge ignore_vulns with allow-list'
      id: merged
      shell: bash
      env:
        BASE_IGNORE: "${{ inputs.ignore_vulns }}"
        # yamllint disable-line rule:line-length
        ALLOW_LIST_IDS: "${{ steps.allow_list.outputs.ids }} ${{ steps.config_resolve.outputs.entries }}"
      run: |
        # Merge ignore_vulns with allow-list IDs (whitespace-
        # separated, de-duplicated, order-preserving).
        set -euo pipefail
        merged=$(printf '%s %s' "$BASE_IGNORE" "$ALLOW_LIST_IDS" \
          | tr '[:space:]' '\n' \
          | awk 'NF && !seen[$0]++' \
          | paste -sd' ' -)
        echo "ignore_vulns=${merged}" >> "$GITHUB_OUTPUT"
        if [ -n "$merged" ]; then
          echo "Effective ignore_vulns: ${merged}"
        else
          echo "Effective ignore_vulns: (none)"
        fi

    # Strict unless permit_fail is exactly 'true' (case-insensitive),
    # so an unrecognised value can never skip both audit steps.
    - name: 'Auditing with: pypa/gh-action-pip-audit'
      id: audit_strict
      if: ${{ inputs.permit_fail != 'true' }}
      # yamllint disable-line rule:line-length
      uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
      with:
        inputs: "${{ inputs.path_prefix }}"
        summary: "${{ inputs.summary }}"
        ignore-vulns: "${{ steps.merged.outputs.ignore_vulns }}"
        virtual-environment: "${{ steps.install.outputs.venv }}"

    - name: 'Auditing with: pypa/gh-action-pip-audit'
      id: audit_permitted
      if: ${{ inputs.permit_fail == 'true' }}
      continue-on-error: true
      # yamllint disable-line rule:line-length
      uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
      with:
        inputs: "${{ inputs.path_prefix }}"
        summary: "${{ inputs.summary }}"
        ignore-vulns: "${{ steps.merged.outputs.ignore_vulns }}"
        virtual-environment: "${{ steps.install.outputs.venv }}"
