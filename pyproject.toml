# This repository is a composite action, not a Python package: nothing
# here is built or published. The [project] table exists only so that
# uv can lock the test dependencies, and package = false keeps it from
# trying to build or install the repository itself.

[project]
name = "python-audit-action"
# Required by the [project] table even though nothing is published.
version = "0.0.0"
# Lock for the oldest CPython the action supports; the self-tests run
# on the newest.
requires-python = ">=3.10"

[tool.uv]
package = false

[dependency-groups]
# What the self-test workflows install, from uv.lock with --locked.
dev = [
    "pytest>=9.2.0",
    "PyYAML>=6.0",
]

[tool.basedpyright]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
# Matches the directories the pre-commit hook passes, so a bare
# basedpyright run or an editor's language server analyses the same set.
include = ["tests"]
