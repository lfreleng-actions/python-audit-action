# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Chore"
    cooldown:
      default-days: 7
      # Our own organisation's actions and reusable workflows skip the
      # cooldown: we review those releases ourselves, and their fixes
      # need to reach callers without a week's delay.
      exclude:
        - "lfreleng-actions/*"
    open-pull-requests-limit: 15
  # The self-test dependencies are locked with uv (pyproject.toml +
  # uv.lock); the uv ecosystem keeps that lockfile current.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Chore"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
