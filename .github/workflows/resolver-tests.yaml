---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Runs the shared config-resolver unit tests (pytest).
#
# The action's main code path is exercised via node (see
# testing.yaml), but the shared src/resolve_config_source.py module
# carries its own pytest suite that pins the `config` grammar and the
# mode-selected sanitisers. Without this job those tests would never
# run in CI and regressions could merge unnoticed.

name: 'Resolver tests 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'src/resolve_config_source.py'
      - 'tests/test_resolve_config_source.py'
      - '.github/workflows/resolver-tests.yaml'
      # The job installs from these, so a dependency bump runs it too.
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: ['main']
    paths:
      - 'src/resolve_config_source.py'
      - 'tests/test_resolve_config_source.py'
      - '.github/workflows/resolver-tests.yaml'
      - 'pyproject.toml'
      - 'uv.lock'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  pytest:
    name: 'Run resolver unit tests'
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Pin the installer too; the action SHA alone leaves uv floating.
          version: '0.13.4'
          python-version: '3.13'

      - name: 'Run resolver unit tests'
        shell: bash
        run: |
          # Hash-pinned via uv.lock; --locked rejects lockfile drift.
          uv run --locked python -m pytest \
            tests/test_resolve_config_source.py -q
