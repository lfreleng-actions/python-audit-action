---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: "GitHub Action"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

env:
  # flask==0.5 contains a known security vulnerability
  DEFECTIVE_DEPS: '["typer>=0.15.2", "jupyterlab>=4.3.6", "flask==0.5"]'

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Run Tests 🧪"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      # Perform setup prior to running test(s)
      - name: "Checkout sample project repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: "lfreleng-actions/test-python-project"
          path: "test-python-project"

      # Build sample Python project
      - name: "Build Python Project"
        id: build
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-build-action@1a1d011cd71e781f9b7896fc9a8c5653406a7758 # v2.1.0
        with:
          path_prefix: "test-python-project/"
          tox_build: false

      # Perform Python project audit
      - name: "Run action: ${{ github.repository }}"
        uses: $/
        with:
          # yamllint disable-line rule:line-length
          python_version: "${{ steps.build.outputs.build_python_version }}"
          path_prefix: "test-python-project/"

      - name: "Inject known defective dependency"
        shell: bash
        env:
          INJECT_DEPS: ${{ env.DEFECTIVE_DEPS }}
        run: |
          # Inject known defective dependency
          cat > /tmp/inject_deps.py << 'EOF'
          import json, os, pathlib, re, tomllib

          toml_path = pathlib.Path("test-python-project/pyproject.toml")
          raw = toml_path.read_text()

          # Parse to validate the file is valid TOML before modification
          tomllib.loads(raw)

          # Build replacement dependencies list from environment variable
          new_deps = json.loads(os.environ["INJECT_DEPS"])
          new_line = "dependencies = " + json.dumps(new_deps)

          # Replace the (possibly multi-line) dependencies array
          updated, count = re.subn(
              r"^dependencies\s*=\s*\[.*?\]",
              new_line,
              raw,
              count=1,
              flags=re.MULTILINE | re.DOTALL,
          )
          assert count == 1, "dependencies array not found in pyproject.toml"

          toml_path.write_text(updated)

          # Validate the result is still valid TOML with expected deps
          check = tomllib.loads(updated)
          deps = check["project"]["dependencies"]
          print(f"dependencies = {deps}")
          assert deps == new_deps, f"deps mismatch: {deps} != {new_deps}"
          print("TOML validation passed ✅")
          EOF
          python3 /tmp/inject_deps.py

      # Rebuild sample Python project
      - name: "Rebuild Python Project"
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-build-action@1a1d011cd71e781f9b7896fc9a8c5653406a7758 # v2.1.0
        with:
          path_prefix: "test-python-project/"
          tox_build: false
          purge_artefact_path: true

      # Perform audit where project has known security vulnerability
      - name: "Run action: ${{ github.repository }} [Failure Test]"
        id: tests-fail
        uses: $/
        # Override failure
        continue-on-error: true
        with:
          # yamllint disable-line rule:line-length
          python_version: "${{ steps.build.outputs.build_python_version }}"
          path_prefix: "test-python-project/"

      - name: "Validate previous step failure"
        if: steps.tests-fail.outcome == 'success'
        shell: bash
        run: |
          # Check previous step failure
          echo "Error: previous step should have failed ❌"
          exit 1

      # Perform audit where project has known security vulnerability
      - name: "Run action: ${{ github.repository }} [Failure Test]"
        id: tests-fail-permitted
        uses: $/
        with:
          # yamllint disable-line rule:line-length
          python_version: "${{ steps.build.outputs.build_python_version }}"
          path_prefix: "test-python-project/"
          # Override failure
          permit_fail: true

  ### Test custom artefact_name support ###
  tests-custom-artefact-name:
    name: "Test Custom Artefact Name"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - name: "Checkout sample project repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: "lfreleng-actions/test-python-project"
          path: "test-python-project"

      # Build with custom artefact name
      - name: "Build Python project with custom artefact name"
        id: build-custom
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-build-action@1a1d011cd71e781f9b7896fc9a8c5653406a7758 # v2.1.0
        with:
          path_prefix: "test-python-project/"
          artefact_name: "test-python-project-x64"
          tox_build: false

      # Audit with custom artefact name
      # Will fail if artefact download does not work
      - name: "Run action with custom artefact_name"
        uses: $/
        with:
          # yamllint disable-line rule:line-length
          python_version: "${{ steps.build-custom.outputs.build_python_version }}"
          path_prefix: "test-python-project/"
          artefact_name: "test-python-project-x64"

  ### Verify the action fails clearly when no wheels are present ###
  tests-no-wheels:
    name: "Test No Wheels Guard"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - name: "Checkout sample project repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: "lfreleng-actions/test-python-project"
          path: "test-python-project"

      # An artefact that downloads cleanly but holds no wheels. A
      # missing artefact would fail earlier, in the download step,
      # and never reach the install step under test here.
      - name: "Create wheel-free artefact"
        shell: bash
        run: |
          # Create wheel-free artefact
          mkdir -p no-wheels
          echo 'Contains no wheels' > no-wheels/README.txt

      - name: "Upload wheel-free artefact"
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "no-wheels-fixture"
          path: "no-wheels"
          if-no-files-found: error

      # This proves the action fails cleanly on a real runner, but it
      # cannot on its own prove the guard is what failed: without the
      # guard, pip chokes on the literal pattern and the outcome is the
      # same. tests/test_install_step_guard.py draws that distinction.
      - name: "Run action against wheel-free artefact"
        id: no-wheels
        uses: $/
        continue-on-error: true
        with:
          python_version: "3.13"
          path_prefix: "test-python-project/"
          artefact_name: "no-wheels-fixture"

      - name: "Validate the no-wheels guard fired"
        shell: bash
        env:
          OUTCOME: "${{ steps.no-wheels.outcome }}"
        run: |
          # Validate the no-wheels guard fired
          # The artefact downloads into the default artefact_path, so
          # its presence proves the download step succeeded and the
          # failure came later, at the install step being tested.
          if [ ! -f dist/README.txt ]; then
            echo 'Error: artefact did not download; wrong failure ❌'
            ls -la dist 2>/dev/null || echo 'dist/ absent'
            exit 1
          fi
          if [ "$OUTCOME" != 'failure' ]; then
            echo 'Error: action succeeded despite there being no wheels ❌'
            echo "Actual outcome: $OUTCOME"
            exit 1
          fi
          echo 'Action failed as expected, with wheels absent ✅'

  ### Unit cover proving the guard is what rejects an empty directory ###
  tests-install-guard:
    name: "Test Install Step Guard"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Python"
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: "Run install step guard tests"
        shell: bash
        run: |
          # Run install step guard tests
          python -m pip install --disable-pip-version-check -q pytest pyyaml
          python -m pytest tests/test_install_step_guard.py -q
